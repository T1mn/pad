[package]
name = "pad"
version = "0.7.6"
edition = "2021"
rust-version = "1.88"
default-run = "pad"
authors = ["T1mn <tinggofun@gmail.com>"]
description = "PAD (Panel for Agent Development) - native terminal workspace for AI agents"
license = "MIT"
repository = "https://github.com/T1mn/pad"

[dependencies]
alacritty_terminal = { version = "0.26", default-features = false }
crossterm = "0.29"
dirs = "6.0"
md5 = "0.7"
nix = { version = "0.29", features = ["term"] }
libc = "0.2"
nucleo-matcher = "0.3"
pulldown-cmark = "0.13"
portable-pty = "0.9"
ratatui = "0.30"
tui-markdown = { version = "0.3", default-features = false }
unicode-width = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.7"
tokio = { version = "1.35", features = ["full"] }
tokio-rustls = "0.26"
tokio-tungstenite = "0.28"
futures-util = "0.3"
rcgen = "0.13"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.31", features = ["bundled"] }
zstd = "0.13"

# Unix-only PTY support
[target.'cfg(unix)'.dependencies]
pty = "0.2"

[profile.release]
opt-level = 3
lto = "thin"

# 更激进的优化配置（用于分发）
[profile.dist]
inherits = "release"
opt-level = "z"      # 优化体积而非速度
lto = true
strip = true
codegen-units = 1
# Embedded terminal engines are isolated with catch_unwind so one faulty pane
# cannot terminate PAD. The distribution profile must preserve unwinding.
panic = "unwind"

[profile.dev]
split-debuginfo = "unpacked"
debug = "line-tables-only"
