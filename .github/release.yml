# GitHub automatically generated release notes config.
# Used when maintainers generate GitHub release notes.
changelog:
  exclude:
    labels:
      - ignore-for-release
      - skip-changelog
  categories:
    - title: Breaking Changes
      labels:
        - breaking-change
        - breaking
    - title: Features
      labels:
        - enhancement
        - feature
    - title: Fixes
      labels:
        - bug
        - fix
    - title: UI / UX
      labels:
        - ui
        - ux
    - title: CI / Release
      labels:
        - ci
        - release
        - automation
    - title: Documentation
      labels:
        - documentation
        - docs
    - title: Other Changes
      labels:
        - "*"
