name: Feature request
description: Suggest a capability or change for PAD.
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        PAD is a macOS desktop client powered directly by Pi. It owns account profiles, task and
        session history, the local terminal, model controls, and the iPhone remote connection.
        Requests that fit this product scope are much easier to evaluate.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do today, and where does PAD get in the way?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should PAD do instead? Include keys, panels, or config if relevant.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Sidebar / session list
        - Conversation and session history
        - Pi login / providers / models
        - Local terminal
        - Permissions and Full Access
        - iPhone remote connection
        - Installer and release
        - Other
    validations:
      required: true

  - type: input
    id: provider
    attributes:
      label: Pi provider and model
      description: If this is model-specific, include the provider and model shown in PAD.
      placeholder: openai-codex / gpt-5.6-sol, or none

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Existing PAD settings, keyboard shortcuts, or workflows you already tried.

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request for this.
