name: Feature request
description: Suggest a capability or change for PAD.
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        PAD is deliberately narrow: it owns a native PTY workspace for agent sessions, while each
        agent CLI remains responsible for its own runtime and history. Requests that stay inside
        that scope are much easier to accept.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do today, and where does PAD get in the way?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should PAD do instead? Include keys, panels, or config if relevant.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Sidebar / session list
        - Preview and session history
        - File tree and preview
        - Native terminal / tabs / splits
        - Relay and provider settings
        - Notifications / Telegram daemon
        - Installer and release
        - Other
    validations:
      required: true

  - type: input
    id: agent
    attributes:
      label: Agent involved
      description: If this is agent-specific, which agent CLI.
      placeholder: Codex, Claude Code, Grok Build, OpenCode, Gemini, none

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Existing keys, shell configuration, or scripts you already tried.

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request for this.
