name: Bug report
description: Something in PAD does not behave the way it should.
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not use this form for security problems. Report those privately, see
        [SECURITY.md](https://github.com/T1mn/pad/blob/master/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what PAD did instead.
      placeholder: |
        Pressed Enter on a Codex thread, expected to focus its pane, PAD stayed on the list.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: PAD version
      description: Output of `pad --version`.
      placeholder: pad 0.7.3
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Linux
        - WSL2
        - Other
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: OS and shell
      description: Distribution or macOS version, shell, and terminal environment.
      placeholder: Ubuntu 24.04, zsh, TERM=xterm-256color
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: How did you install PAD
      options:
        - One-line installer (curl | bash)
        - Installer from a local clone
        - Source build (cargo build --profile dist)
        - Other
    validations:
      required: true

  - type: input
    id: agent
    attributes:
      label: Agent involved
      description: Which agent CLI the affected session belongs to, if any.
      placeholder: Codex, Claude Code, Grok Build, OpenCode, Gemini, none

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: |
        Relevant output and logs from `~/.pad/logs/`. Redact tokens and API keys.
      render: shell
