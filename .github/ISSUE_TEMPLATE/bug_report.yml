name: Bug report
description: PAD Desktop does not behave as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not publish credentials or session data. Report security problems privately.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, expected, and saw.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PAD Desktop version
      placeholder: Copy the version from Settings → About
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS and Mac model
      placeholder: macOS 15, MacBook Pro M3
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Pi provider and model
      placeholder: openai-codex / gpt-5.6-sol
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Redact tokens, account names, paths, and private conversation content.
